[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
og-core = { path = "crates/og-core" }
og-store = { path = "crates/og-store" }
og-net = { path = "crates/og-net" }
og-ctl = { path = "crates/og-ctl" }
og-node = { path = "crates/og-node" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
data-encoding = "2"
tokio = { version = "1", features = ["full"] }
iroh = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
proptest = "1"
